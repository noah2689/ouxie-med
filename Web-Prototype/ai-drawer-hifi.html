<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>瓯械健康 — AI 会话管理抽屉 高保真 UI</title>
<style>
/* ═══════════════════════════════════════════════
   高保真 UI — 瓯械健康 · AI 会话管理抽屉
   设计规范 v1.1  |  390 × 844 WeChat Mini Program
   ═══════════════════════════════════════════════ */

/* ── Tokens ── */
:root {
  --brand: #2EAB8A;
  --brand-soft: #E8F6F1;
  --brand-press: #269C7A;
  --surface-brand: #F0F9F5;

  --bg-page: #F5F6F8;
  --bg-card: #FFFFFF;
  --bg-input: #F8F9FA;
  --bg-press: #F0F1F3;
  --bg-overlay: rgba(0,0,0,0.40);
  --bg-tab-bar: #FFFFFF;
  --bg-nav-bar: #FFFFFF;

  --fg-primary: #1A1A2E;
  --fg-body: #4A4A5A;
  --fg-secondary: #8E8E9A;
  --fg-placeholder: #B8B8C4;
  --fg-disabled: #C8C8D4;
  --fg-on-brand: #FFFFFF;

  --border-card: #E8E8EE;
  --border-divider: #F0F0F2;
  --border-input: #D8D8E0;
  --border-strong: #C8C8D0;

  --state-attention: #E8913A;
  --state-normal: #5B9E7A;
  --state-rec: #7A8C9E;
  --state-rec-bg: #F5F6F8;
  --state-rec-border: #D0D5DA;
  --state-pending: #B0A090;
  --state-pending-bg: #FAF8F5;
  --state-pending-border: #E0D8D0;

  --shadow-card: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-raised: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-tab: 0 -1px 3px rgba(0,0,0,0.04);

  --motion-fast: 150ms;
  --motion-base: 200ms;
  --ease: cubic-bezier(0.2, 0, 0, 1);
}

/* ── Reset & Base ── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;padding:20px 0;
  background:#D0D1D6;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* ── Phone frame ── */
.phone{
  width:390px;height:844px;
  background:var(--bg-page);
  border-radius:40px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.08),0 8px 32px rgba(0,0,0,.15);
  display:flex;flex-direction:column;position:relative
}

/* ── Status bar ── */
.status-bar{
  height:44px;background:var(--bg-nav-bar);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;flex-shrink:0
}
.s-time{font-size:15px;font-weight:700;color:var(--fg-primary);letter-spacing:.3px}
.s-icons{display:flex;align-items:center;gap:6px}
.s-icons .s-sig{display:flex;gap:2px;align-items:flex-end;height:12px}
.s-icons .s-sig span{display:block;width:3px;background:#B0B0BC;border-radius:1px}
.s-icons .s-sig span:nth-child(1){height:5px}
.s-icons .s-sig span:nth-child(2){height:8px}
.s-icons .s-sig span:nth-child(3){height:11px}
.s-icons .s-network{font-size:11px;color:var(--fg-secondary);font-weight:500;letter-spacing:.3px}
.s-icons .s-battery{display:flex;align-items:center;gap:3px}
.s-icons .s-battery .s-pct{font-size:11px;color:var(--fg-secondary);font-weight:500}
.s-icons .s-battery .s-bat{
  width:22px;height:11px;border:1px solid #B0B0BC;border-radius:3px;position:relative;background:transparent
}
.s-icons .s-battery .s-bat::after{
  content:'';position:absolute;right:-4px;top:2.5px;
  width:2px;height:4px;background:#B0B0BC;border-radius:0 1px 1px 0
}

/* ── Navigation bar ── */
.nav{
  height:44px;background:var(--bg-nav-bar);
  display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid var(--border-divider);flex-shrink:0;position:relative
}
.nav .n-title{font-size:17px;font-weight:600;color:var(--fg-primary)}
.nav .n-capsule{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  width:70px;height:26px;border:1px solid #D0D0D8;border-radius:13px;
  display:flex;align-items:center;justify-content:center;gap:5px
}
.nav .n-capsule .c-bar{width:16px;height:2px;background:#C0C0C8;border-radius:1px}
.nav .n-capsule .c-dot{width:4px;height:4px;border-radius:50%;background:#C0C0C8}

/* ── Simulated background page (dimmed) ── */
.content{
  flex:1;overflow-y:auto;background:var(--bg-page);
  padding:12px 16px;pointer-events:none;user-select:none
}
.content .bg-block{
  background:var(--bg-card);
  border:1px solid var(--border-card);border-radius:12px;
  padding:14px;margin-bottom:10px;
  opacity:.55
}
.content .bg-block .bg-title{
  font-size:13px;font-weight:500;color:var(--fg-secondary);margin-bottom:8px
}
.content .bg-row{
  display:flex;gap:8px;margin-bottom:6px;
  height:14px;background:var(--bg-page);border-radius:4px;
  opacity:.5
}
.content .bg-row.h{height:18px;width:70%}
.content .bg-row.w2{width:45%}
.content .bg-row.w3{width:60%}
.content .bg-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:8px
}
.content .bg-grid .bg-cell{
  height:60px;background:var(--bg-page);border-radius:8px;opacity:.5
}

/* ── Overlay ── */
.drawer-overlay{
  position:absolute;inset:0;
  background:var(--bg-overlay);
  z-index:20;cursor:pointer
}

/* ── Drawer panel ── */
.drawer{
  position:absolute;left:0;top:0;bottom:0;
  width:300px;background:var(--bg-card);
  z-index:25;display:flex;flex-direction:column;
  box-shadow:2px 0 16px rgba(0,0,0,.1);
  border-top-right-radius:0;border-bottom-right-radius:0
}

/* ── Drawer header ── */
.drawer .d-hd{
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:16px 16px 8px
}
.drawer .d-hd .d-hd-left{flex:1}
.drawer .d-hd .d-hd-left .d-title{
  font-size:17px;font-weight:600;color:var(--fg-primary);margin-bottom:2px
}
.drawer .d-hd .d-hd-left .d-sub{
  font-size:11px;color:var(--fg-secondary)
}
.drawer .d-hd .d-close{
  width:26px;height:26px;
  border:1px solid var(--border-card);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
  transition:background var(--motion-fast) var(--ease)
}
.drawer .d-hd .d-close:active{background:var(--bg-press)}
.drawer .d-hd .d-close span{
  display:block;width:12px;height:1.5px;background:var(--fg-placeholder);
  transform:rotate(45deg);position:relative
}
.drawer .d-hd .d-close span::after{
  content:'';display:block;width:12px;height:1.5px;background:var(--fg-placeholder);
  transform:rotate(90deg);position:absolute;top:-.75px
}

/* ── New session button ── */
.drawer .d-new{
  margin:8px 16px 12px;
  height:40px;
  background:var(--brand);border:none;border-radius:10px;
  display:flex;align-items:center;justify-content:center;gap:4px;
  cursor:pointer;
  transition:background var(--motion-fast) var(--ease);
  font-family:inherit
}
.drawer .d-new:active{background:var(--brand-press)}
.drawer .d-new .dn-icon{font-size:16px;font-weight:300;color:var(--fg-on-brand);line-height:1}
.drawer .d-new .dn-txt{font-size:14px;font-weight:500;color:var(--fg-on-brand)}

/* ── Session list ── */
.drawer .d-list{flex:1;overflow-y:auto;padding:0 16px}
.drawer .d-list::-webkit-scrollbar{display:none}

.drawer .d-item{
  padding:12px 0;border-bottom:1px solid var(--border-divider);
  position:relative;cursor:pointer;
  transition:background var(--motion-fast) var(--ease)
}
.drawer .d-item:active{background:var(--bg-press);margin:0 -8px;padding:12px 8px;border-radius:8px}
.drawer .d-item:last-child{border-bottom:none}

.drawer .d-item .di-tags{
  display:flex;align-items:center;gap:6px;margin-bottom:4px
}
.drawer .d-item .di-tags .di-tag{
  font-size:10px;font-weight:500;
  padding:1px 6px;border-radius:3px;line-height:1.4
}
.drawer .d-item .di-tags .di-tag.tag-current{
  color:var(--brand);border:1px solid var(--brand-soft);background:var(--surface-brand)
}
.drawer .d-item .di-tags .di-tag.tag-rec{
  color:var(--state-rec);border:1px solid var(--state-rec-border);background:var(--state-rec-bg)
}
.drawer .d-item .di-tags .di-tag.tag-pending{
  color:var(--state-pending);border:1px solid var(--state-pending-border);background:var(--state-pending-bg)
}

.drawer .d-item .di-title{
  font-size:14px;font-weight:500;color:var(--fg-primary);margin-bottom:2px
}
.drawer .d-item .di-summary{
  font-size:12px;color:var(--fg-secondary);line-height:1.5;margin-bottom:2px
}
.drawer .d-item .di-time{
  font-size:11px;color:var(--fg-placeholder)
}

/* Current session highlight */
.drawer .d-item.di-current{
  background:var(--bg-press);border-radius:8px;
  margin:0 -8px;padding:12px 8px;
  border-left:3px solid var(--brand);
  border-bottom-color:transparent
}

/* ── Bottom action ── */
.drawer .d-bottom{
  padding:12px 16px;
  border-top:1px solid var(--border-divider);
  flex-shrink:0
}
.drawer .d-bottom .db-btn{
  display:block;width:100%;height:38px;
  background:var(--bg-card);border:1px solid var(--border-card);border-radius:8px;
  font-size:12px;font-weight:400;color:var(--fg-placeholder);
  cursor:pointer;
  transition:all var(--motion-fast) var(--ease);
  font-family:inherit;
  margin-bottom:4px
}
.drawer .d-bottom .db-btn:active{background:var(--bg-press);color:var(--fg-secondary)}
.drawer .d-bottom .db-note{
  font-size:10px;color:var(--fg-placeholder);text-align:center
}

/* ── Input bar (dimmed) ── */
.input-bar{
  background:var(--bg-tab-bar);
  border-top:1px solid var(--border-divider);
  padding:8px 12px;flex-shrink:0;
  display:flex;align-items:center;gap:8px;
  opacity:.4;pointer-events:none;
  padding-bottom:calc(env(safe-area-inset-bottom,0) + 8px)
}
.input-bar .ib-input{
  flex:1;height:38px;
  border:1px solid var(--border-input);border-radius:8px;
  padding:0 12px;font-size:14px;background:var(--bg-input);
  outline:none;font-family:inherit
}
.input-bar .ib-send{
  width:38px;height:38px;border-radius:8px;
  background:var(--brand);border:none;
  display:flex;align-items:center;justify-content:center;flex-shrink:0
}
.input-bar .ib-send svg{width:16px;height:16px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ── Bottom tab bar (dimmed) ── */
.tab-bar{
  height:50px;
  background:var(--bg-tab-bar);
  border-top:1px solid var(--border-divider);
  box-shadow:var(--shadow-tab);
  display:flex;align-items:center;justify-content:space-around;
  flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom,0);
  opacity:.4;pointer-events:none
}
.tab-item{
  display:flex;flex-direction:column;align-items:center;gap:2px
}
.tab-item .tb-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.tab-item .tb-lbl{font-size:10px;font-weight:500;letter-spacing:.3px}
.tab-item .tb-icon,.tab-item .tb-lbl{color:#B0B0BC}
.tab-item.on .tb-icon,.tab-item.on .tb-lbl{color:#B0B0BC}
.tb-icon svg{display:block}
</style>
</head>
<body>

<!-- ═══ Phone frame ═══ -->
<div class="phone">

  <!-- ── Status bar ── -->
  <div class="status-bar">
    <span class="s-time">9:41</span>
    <div class="s-icons">
      <div class="s-sig"><span></span><span></span><span></span></div>
      <span class="s-network">5G</span>
      <div class="s-battery">
        <span class="s-pct">87%</span>
        <span class="s-bat"></span>
      </div>
    </div>
  </div>

  <!-- ── Navigation bar ── -->
  <div class="nav">
    <span class="n-title">AI 助手</span>
    <div class="n-capsule">
      <span class="c-bar"></span>
      <span class="c-dot"></span>
    </div>
  </div>

  <!-- ── Simulated AI Assistant page (dimmed background) ── -->
  <div class="content">

    <!-- Introduction card dimmed -->
    <div class="bg-block">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:36px;height:36px;border-radius:50%;background:var(--bg-page);flex-shrink:0;opacity:.6"></div>
        <div style="flex:1">
          <div class="bg-row h"></div>
          <div class="bg-row w3"></div>
        </div>
      </div>
    </div>

    <!-- Quick questions dimmed -->
    <div class="bg-block" style="padding:10px 14px">
      <div class="bg-title">你可以这样问</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        <div class="bg-row" style="width:90px;height:22px;border-radius:8px;opacity:.4"></div>
        <div class="bg-row" style="width:120px;height:22px;border-radius:8px;opacity:.4"></div>
        <div class="bg-row" style="width:105px;height:22px;border-radius:8px;opacity:.4"></div>
        <div class="bg-row" style="width:135px;height:22px;border-radius:8px;opacity:.4"></div>
      </div>
    </div>

    <!-- Summary card dimmed -->
    <div class="bg-block">
      <div class="bg-title">今日摘要</div>
      <div class="bg-row h"></div>
      <div class="bg-row w2"></div>
      <div class="bg-row" style="margin-top:6px"></div>
      <div class="bg-row w3"></div>
    </div>

    <!-- Chat dimmed -->
    <div class="bg-block" style="padding:10px 14px">
      <div style="display:flex;gap:8px;align-items:flex-start">
        <div style="width:28px;height:28px;border-radius:50%;background:var(--bg-page);flex-shrink:0;opacity:.5"></div>
        <div style="flex:1">
          <div class="bg-row" style="width:80%;height:14px"></div>
          <div class="bg-row" style="width:55%;height:14px"></div>
        </div>
      </div>
    </div>

  </div><!-- /content dimmed -->

  <!-- ── Input bar (dimmed) ── -->
  <div class="input-bar">
    <input class="ib-input" placeholder="输入你的健康问题" readonly>
    <div class="ib-send">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </div>
  </div>

  <!-- ── Bottom tab bar (dimmed) ── -->
  <div class="tab-bar">
    <div class="tab-item">
      <span class="tb-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          <polyline points="12 8.5 12 12 14 14"/>
        </svg>
      </span>
      <span class="tb-lbl">健康</span>
    </div>
    <div class="tab-item on">
      <span class="tb-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </span>
      <span class="tb-lbl">AI 助手</span>
    </div>
    <div class="tab-item">
      <span class="tb-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </span>
      <span class="tb-lbl">我的</span>
    </div>
  </div>

  <!-- ═══ Overlay ═══ -->
  <div class="drawer-overlay" id="overlay"></div>

  <!-- ═══ Session Drawer ═══ -->
  <div class="drawer" id="drawer">

    <!-- ── Header ── -->
    <div class="d-hd">
      <div class="d-hd-left">
        <div class="d-title">AI 会话</div>
        <div class="d-sub">管理你的健康记录问答</div>
      </div>
      <div class="d-close" id="btnClose">
        <span></span>
      </div>
    </div>

    <!-- ── New session ── -->
    <div class="d-new" id="btnNew">
      <span class="dn-icon">+</span>
      <span class="dn-txt">新建会话</span>
    </div>

    <!-- ── Session list ── -->
    <div class="d-list">

      <!-- Session 1: current -->
      <div class="d-item di-current" data-session="0">
        <div class="di-tags">
          <span class="di-tag tag-current">当前会话</span>
        </div>
        <div class="di-title">最近血压趋势</div>
        <div class="di-summary">查看晨起和睡前记录变化</div>
        <div class="di-time">今天 09:12</div>
      </div>

      <!-- Session 2 -->
      <div class="d-item" data-session="1">
        <div class="di-tags">
          <span class="di-tag tag-rec">已记录</span>
        </div>
        <div class="di-title">血糖记录建议</div>
        <div class="di-summary">整理空腹和餐后记录习惯</div>
        <div class="di-time">昨天 20:30</div>
      </div>

      <!-- Session 3 -->
      <div class="d-item" data-session="2">
        <div class="di-tags">
          <span class="di-tag tag-pending">记录较少</span>
        </div>
        <div class="di-title">尿酸记录变化</div>
        <div class="di-summary">关注近 7 天记录连续性</div>
        <div class="di-time">6月8日</div>
      </div>

      <!-- Session 4 -->
      <div class="d-item" data-session="3">
        <div class="di-tags">
          <span class="di-tag tag-rec">已记录</span>
        </div>
        <div class="di-title">今日还需记录什么</div>
        <div class="di-summary">根据今日记录提醒补充项目</div>
        <div class="di-time">6月7日</div>
      </div>

    </div><!-- /d-list -->

    <!-- ── Bottom action ── -->
    <div class="d-bottom">
      <button class="db-btn" id="btnClear">清理历史会话</button>
      <div class="db-note">仅清理本地演示记录</div>
    </div>

  </div><!-- /drawer -->

</div><!-- /phone -->

<script>
(function(){
  var sessionNames = ['最近血压趋势', '血糖记录建议', '尿酸记录变化', '今日还需记录什么'];

  // ── Overlay click ──
  document.getElementById('overlay').addEventListener('click', function(){
    console.log('[抽屉占位] 关闭 AI 会话抽屉');
  });

  // ── Close button ──
  document.getElementById('btnClose').addEventListener('click', function(){
    console.log('[抽屉占位] 关闭 AI 会话抽屉');
  });

  // ── New session ──
  document.getElementById('btnNew').addEventListener('click', function(){
    console.log('[AI 占位] 新建 AI 会话');
  });

  // ── Session items ──
  document.querySelectorAll('.d-item').forEach(function(item){
    item.addEventListener('click', function(){
      var idx = parseInt(this.dataset.session);
      var name = sessionNames[idx] || '未知会话';
      console.log('[AI 占位] 切换会话：' + name);

      // Toggle current state
      document.querySelectorAll('.d-item').forEach(function(sib){
        sib.classList.remove('di-current');
        sib.style.borderLeftColor = 'transparent';
        var tag = sib.querySelector('.di-tag');
        // Reset tag to original by dataset
        var si = parseInt(sib.dataset.session);
        if (si === 0) { tag.textContent = '已记录'; tag.className = 'di-tag tag-rec'; }
        else if (si === 1) { tag.textContent = '已记录'; tag.className = 'di-tag tag-rec'; }
        else if (si === 2) { tag.textContent = '记录较少'; tag.className = 'di-tag tag-pending'; }
        else if (si === 3) { tag.textContent = '已记录'; tag.className = 'di-tag tag-rec'; }
      });
      this.classList.add('di-current');
      this.style.borderLeftColor = '';
      var tag = this.querySelector('.di-tag');
      tag.textContent = '当前会话';
      tag.className = 'di-tag tag-current';
    });
  });

  // ── Clear history ──
  document.getElementById('btnClear').addEventListener('click', function(){
    console.log('[AI 占位] 清理历史会话');
  });

})();
</script>

</body>
</html>
