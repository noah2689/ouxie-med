<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>瓯械健康 — 家庭成员 高保真 UI</title>
<style>
/* ═══════════════════════════════════════════════
   高保真 UI — 瓯械健康 · 家庭成员页
   设计规范 v1.1  |  390 × 844 WeChat Mini Program
   ═══════════════════════════════════════════════ */

/* ── Tokens (inherited from home, my pages) ── */
:root {
  --brand: #2EAB8A;
  --brand-soft: #E8F6F1;
  --brand-press: #269C7A;
  --surface-brand: #F0F9F5;

  --bg-page: #F5F6F8;
  --bg-card: #FFFFFF;
  --bg-input: #F8F9FA;
  --bg-press: #F0F1F3;
  --bg-overlay: rgba(0,0,0,0.40);
  --bg-nav-bar: #FFFFFF;

  --fg-primary: #1A1A2E;
  --fg-body: #4A4A5A;
  --fg-secondary: #8E8E9A;
  --fg-placeholder: #B8B8C4;
  --fg-disabled: #C8C8D4;
  --fg-on-brand: #FFFFFF;

  --border-card: #E8E8EE;
  --border-divider: #F0F0F2;
  --border-input: #D8D8E0;

  --state-attention: #E8913A;
  --state-attention-bg: #FFF8F0;
  --state-attention-border: #F0D5A8;
  --state-normal: #5B9E7A;
  --state-normal-bg: #F0F8F3;
  --state-normal-border: #C8E0D0;
  --state-rec: #7A8C9E;
  --state-rec-bg: #F5F6F8;
  --state-rec-border: #D0D5DA;
  --state-pending: #B0A090;
  --state-pending-bg: #FAF8F5;
  --state-pending-border: #E0D8D0;

  --shadow-card: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-raised: 0 2px 8px rgba(0,0,0,0.06);

  --motion-fast: 150ms;
  --motion-base: 200ms;
  --ease: cubic-bezier(0.2, 0, 0, 1);
}

/* ── Reset & Base ── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;padding:20px 0;
  background:#D0D1D6;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* ── Phone frame ── */
.phone{
  width:390px;height:844px;
  background:var(--bg-page);
  border-radius:40px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(0,0,0,.08),0 8px 32px rgba(0,0,0,.15);
  display:flex;flex-direction:column;
  position:relative
}

/* ── Status bar ── */
.status-bar{
  height:44px;background:var(--bg-nav-bar);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;flex-shrink:0
}
.s-time{font-size:15px;font-weight:700;color:var(--fg-primary);letter-spacing:.3px}
.s-icons{display:flex;align-items:center;gap:6px}
.s-icons .s-sig{display:flex;gap:2px;align-items:flex-end;height:12px}
.s-icons .s-sig span{display:block;width:3px;background:#B0B0BC;border-radius:1px}
.s-icons .s-sig span:nth-child(1){height:5px}
.s-icons .s-sig span:nth-child(2){height:8px}
.s-icons .s-sig span:nth-child(3){height:11px}
.s-icons .s-network{font-size:11px;color:var(--fg-secondary);font-weight:500;letter-spacing:.3px}
.s-icons .s-battery{display:flex;align-items:center;gap:3px}
.s-icons .s-battery .s-pct{font-size:11px;color:var(--fg-secondary);font-weight:500}
.s-icons .s-battery .s-bat{
  width:22px;height:11px;border:1px solid #B0B0BC;border-radius:3px;position:relative;background:transparent
}
.s-icons .s-battery .s-bat::after{
  content:'';position:absolute;right:-4px;top:2.5px;
  width:2px;height:4px;background:#B0B0BC;border-radius:0 1px 1px 0
}

/* ── Navigation bar (secondary page with back) ── */
.nav{
  height:44px;background:var(--bg-nav-bar);
  display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid var(--border-divider);flex-shrink:0;position:relative
}
.nav .n-back{
  position:absolute;left:8px;top:50%;transform:translateY(-50%);
  display:flex;align-items:center;gap:3px;
  font-size:13px;color:var(--fg-secondary);cursor:pointer;
  padding:6px 10px;z-index:2;
  transition:opacity var(--motion-fast) var(--ease);border:none;background:transparent;font-family:inherit
}
.nav .n-back:active{opacity:.7}
.nav .n-back::before{
  content:'';display:inline-block;
  width:8px;height:8px;
  border-left:2px solid var(--fg-secondary);
  border-bottom:2px solid var(--fg-secondary);
  transform:rotate(45deg)
}
.nav .n-title{font-size:17px;font-weight:600;color:var(--fg-primary)}
.nav .n-capsule{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  width:70px;height:26px;border:1px solid #D0D0D8;border-radius:13px;
  display:flex;align-items:center;justify-content:center;gap:5px
}
.nav .n-capsule .c-bar{width:16px;height:2px;background:#C0C0C8;border-radius:1px}
.nav .n-capsule .c-dot{width:4px;height:4px;border-radius:50%;background:#C0C0C8}

/* ── Scrollable content ── */
.content{
  flex:1;overflow-y:auto;background:var(--bg-page);
  -webkit-overflow-scrolling:touch;scroll-behavior:smooth
}
.content::-webkit-scrollbar{display:none}
.content-spacer{height:6px}
.sec{margin-bottom:12px}

/* ── Status tags (reusable) ── */
.sts-tag{
  display:inline-block;font-size:10px;font-weight:500;
  padding:2px 7px;border-radius:3px;line-height:1.4;vertical-align:middle
}
.sts-tag.sts-brand{
  color:var(--brand);border:1px solid var(--brand);background:var(--surface-brand)
}
.sts-tag.sts-ok{
  color:var(--state-normal);border:1px solid var(--state-normal-border);background:var(--state-normal-bg)
}
.sts-tag.sts-pending{
  color:var(--state-pending);border:1px dashed var(--state-pending-border);background:var(--state-pending-bg)
}

/* ================================================================ */
/* FAMILY MEMBERS PAGE                                             */
/* ================================================================ */

/* ─── ① Current member hint card ─── */
.fm-hint{
  background:var(--bg-card);
  border:1px solid var(--border-card);border-radius:12px;
  padding:14px 16px;margin:12px 16px 0;
  display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow-card)
}
.fm-hint .hint-dot{
  width:8px;height:8px;border-radius:50%;background:var(--brand);flex-shrink:0
}
.fm-hint .hint-body{flex:1;min-width:0}
.fm-hint .hint-title{
  font-size:13px;font-weight:600;color:var(--fg-primary);margin-bottom:2px
}
.fm-hint .hint-desc{
  font-size:11px;color:var(--fg-secondary);line-height:1.5
}
.fm-hint .hint-tag{
  margin-left:auto;flex-shrink:0
}

/* ─── ② Member list ─── */
.fm-list{margin:10px 16px 0}

.fm-card{
  background:var(--bg-card);
  border:1px solid var(--border-card);border-radius:12px;
  padding:16px;margin-bottom:10px;
  box-shadow:var(--shadow-card);cursor:pointer;
  transition:background var(--motion-fast) var(--ease)
}
.fm-card:last-child{margin-bottom:0}
.fm-card:active{background:var(--bg-press)}

.fm-row{display:flex;gap:12px}

.fm-avatar{
  width:44px;height:44px;border-radius:50%;
  border:1.5px solid var(--border-card);background:var(--bg-input);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--fg-secondary);font-weight:600;flex-shrink:0;
  font-family:inherit
}

.fm-body{flex:1;min-width:0}
.fm-top{
  display:flex;align-items:center;gap:6px;margin-bottom:3px
}
.fm-name{font-size:15px;font-weight:600;color:var(--fg-primary)}
.fm-rel-tag{
  display:inline-block;font-size:10px;font-weight:500;color:var(--fg-secondary);
  border:1px solid var(--border-input);border-radius:3px;
  padding:1px 6px;background:var(--bg-input)
}
.fm-basic{
  font-size:12px;color:var(--fg-secondary);margin-bottom:4px;
  display:flex;align-items:center;gap:6px
}
.fm-meta{
  font-size:11px;color:var(--fg-placeholder);margin-bottom:5px;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap
}
.fm-attn{
  font-size:11px;color:var(--fg-secondary);margin-bottom:8px;
  display:flex;align-items:center;gap:4px
}
.fm-attn .attn-label{
  color:var(--fg-placeholder)
}
.fm-attn .attn-item{
  color:var(--fg-body);font-weight:500
}
.fm-attn .attn-item.attn-imp{color:var(--state-attention)}

.fm-acts{
  display:flex;gap:6px;
  padding-top:8px;border-top:1px solid var(--border-divider)
}
.fm-acts .fm-btn{
  font-size:12px;font-weight:400;color:var(--fg-body);
  border:1px solid var(--border-input);border-radius:5px;
  padding:5px 14px;background:var(--bg-card);cursor:pointer;
  transition:all var(--motion-fast) var(--ease);font-family:inherit
}
.fm-acts .fm-btn:active{background:var(--bg-press)}
.fm-acts .fm-btn.fm-prim{
  color:var(--brand);border-color:var(--brand);background:var(--surface-brand)
}

/* ─── ③ Tap hint status label ─── */
.fm-tap-hint{
  display:inline-block;font-size:10px;font-weight:500;
  padding:2px 7px;border-radius:3px;line-height:1.4;vertical-align:middle
}

/* ─── ④ Add member guide card ─── */
.add-card{
  background:var(--bg-card);
  border:1px dashed var(--border-input);border-radius:12px;
  padding:16px;margin:10px 16px 0;text-align:center;
  box-shadow:var(--shadow-card)
}
.add-card .ac-title{
  font-size:14px;font-weight:600;color:var(--fg-primary);margin-bottom:4px
}
.add-card .ac-desc{
  font-size:12px;color:var(--fg-secondary);margin-bottom:10px;line-height:1.6
}
.add-card .ac-btn{
  font-size:13px;font-weight:500;color:var(--fg-on-brand);
  background:var(--brand);border:none;border-radius:8px;
  padding:10px 24px;display:inline-block;cursor:pointer;font-family:inherit;
  transition:all var(--motion-fast) var(--ease)
}
.add-card .ac-btn:active{background:var(--brand-press)}
</style>
</head>
<body>

<!-- ═══ Phone frame ═══ -->
<div class="phone">

  <!-- ── Status bar ── -->
  <div class="status-bar">
    <span class="s-time">9:41</span>
    <div class="s-icons">
      <div class="s-sig"><span></span><span></span><span></span></div>
      <span class="s-network">5G</span>
      <div class="s-battery"><span class="s-pct">87%</span><span class="s-bat"></span></div>
    </div>
  </div>

  <!-- ── Navigation bar ── -->
  <div class="nav">
    <button class="n-back" id="backBtn">返回</button>
    <span class="n-title">家庭成员</span>
    <div class="n-capsule"><span class="c-bar"></span><span class="c-dot"></span></div>
  </div>

  <!-- ── Scrollable content ── -->
  <div class="content">

    <!-- ─── ① 当前成员提示卡片 ─── -->
    <div class="fm-hint">
      <span class="hint-dot"></span>
      <div class="hint-body">
        <div class="hint-title">当前查看：本人</div>
        <div class="hint-desc">健康首页和记录页面将优先展示该成员的数据</div>
      </div>
      <span class="sts-tag sts-brand hint-tag">默认成员</span>
    </div>

    <!-- ─── ② 家庭成员列表 ─── -->
    <div class="fm-list">

      <!-- 成员 1：本人 -->
      <div class="fm-card" data-member="本人">
        <div class="fm-row">
          <div class="fm-avatar">本</div>
          <div class="fm-body">
            <div class="fm-top">
              <span class="fm-name">本人</span>
              <span class="fm-rel-tag">本人</span>
              <span class="sts-tag sts-brand" style="margin-left:auto">默认成员</span>
            </div>
            <div class="fm-basic">男 · 32 岁</div>
            <div class="fm-meta">
              <span>最近记录：今日 07:30</span>
            </div>
            <div class="fm-attn">
              <span class="attn-label">健康关注：</span>
              <span class="attn-item attn-imp">血压</span>
              <span class="attn-item attn-imp" style="color:var(--fg-body)">· 尿酸</span>
            </div>
            <div class="fm-acts">
              <button class="fm-btn fm-prim viewRecordBtn">查看记录</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 成员 2：父亲 -->
      <div class="fm-card" data-member="父亲">
        <div class="fm-row">
          <div class="fm-avatar">父</div>
          <div class="fm-body">
            <div class="fm-top">
              <span class="fm-name">父亲</span>
              <span class="fm-rel-tag">父亲</span>
              <span class="sts-tag sts-ok" style="margin-left:auto">已添加</span>
            </div>
            <div class="fm-basic">男 · 61 岁</div>
            <div class="fm-meta">
              <span>最近记录：昨天 20:15</span>
            </div>
            <div class="fm-attn">
              <span class="attn-label">健康关注：</span>
              <span class="attn-item attn-imp">血压</span>
            </div>
            <div class="fm-acts">
              <button class="fm-btn viewRecordBtn">查看记录</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 成员 3：母亲 -->
      <div class="fm-card" data-member="母亲">
        <div class="fm-row">
          <div class="fm-avatar">母</div>
          <div class="fm-body">
            <div class="fm-top">
              <span class="fm-name">母亲</span>
              <span class="fm-rel-tag">母亲</span>
              <span class="sts-tag sts-pending" style="margin-left:auto">待完善</span>
            </div>
            <div class="fm-basic">女 · 58 岁</div>
            <div class="fm-meta">
              <span>最近记录：暂无</span>
            </div>
            <div class="fm-attn">
              <span class="attn-label">健康关注：</span>
              <span class="attn-item">血糖</span>
            </div>
            <div class="fm-acts">
              <button class="fm-btn fm-prim viewRecordBtn">完善资料</button>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- ─── ③ 添加成员引导卡片 ─── -->
    <div class="add-card">
      <div class="ac-title">添加家庭成员</div>
      <div class="ac-desc">为家人建立独立健康记录，便于长期查看和提醒</div>
      <button class="ac-btn" id="addMemberBtn">添加成员</button>
    </div>

    <div class="content-spacer"></div>
  </div><!-- /content -->

</div><!-- /phone -->

<script>
(function(){
  /* ── 导航占位 ── */

  // 返回按钮
  document.getElementById('backBtn').addEventListener('click', function(){
    console.log('[导航占位] 家庭成员返回上一页');
  });

  // 成员卡片点击
  document.querySelectorAll('.fm-card').forEach(function(el){
    el.addEventListener('click', function(){
      var member = el.getAttribute('data-member') || '';
      console.log('[成员占位] 切换查看' + member);
    });
  });

  // 查看记录 / 完善资料 按钮
  document.querySelectorAll('.viewRecordBtn').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var card = btn.closest('.fm-card');
      var member = card ? card.getAttribute('data-member') : '';
      var action = btn.textContent.trim();
      if(action === '完善资料'){
        console.log('[导航占位] 完善成员资料');
      } else {
        console.log('[导航占位] 查看成员记录');
      }
    });
  });

  // 添加成员
  document.getElementById('addMemberBtn').addEventListener('click', function(){
    console.log('[弹窗占位] 打开添加家庭成员');
  });

})();
</script>

</body>
</html>
